name: Publish

on:
  workflow_dispatch:
    inputs:
      image_only:
        description: Publish the container image without publishing npm
        type: boolean
        default: false
  push:
    branches: [release]

permissions:
  contents: read

concurrency: publish

jobs:
  build:
    if: inputs.image_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            target: apple
            ref: f344daf6700c191b2f7d85a4b9c8578928ef2229
          - runner: ubuntu-24.04
            platform: linux-x64
            target: linux
            ref: 75f942773783814fa8cac26cc2b2d135af94b555
          - runner: windows-2025
            platform: win32-x64
            target: windows
            ref: 6ea818ad17d6c8f6b9628b589e672be3ea843705
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: html-renderer
    steps:
      - uses: actions/checkout@v4
        with:
          path: html-renderer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/cli
          ref: 341ef9a24ae684f6a1d2c9b3abd3b9482c826de0
          path: cli
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/core
          ref: 974a702e26238b5dd3db46c1a91b37d9d26029ee
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/${{ matrix.target }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.target }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/compiler
          ref: f97e0d3a36fd2d7df262df9e1e371f21893bf67d
          path: compiler
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          rustup toolchain install 1.96 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.96' >> "$GITHUB_ENV"
          packages=(libsdl2-dev libcurl4-openssl-dev libfreetype-dev)
          if ! command -v ffmpeg || ! command -v ffprobe; then packages+=(ffmpeg); fi
          # Use the archive directly. The runner's mirror list can select a
          # regional endpoint even when ubuntu.sources has no regional URL.
          sources=/etc/apt/geastack-release.list
          sudo tee "$sources" >/dev/null <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"
      - name: Prepare FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then brew install ffmpeg; fi
      - name: Prepare FFmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then choco install ffmpeg -y --no-progress; fi
          echo 'C:/ProgramData/chocolatey/bin' >> "$GITHUB_PATH"
      - name: Prepare Apple bindings
        if: runner.os == 'macOS'
        run: |
          npm ci --ignore-scripts --prefix ../apple
          npm ci --ignore-scripts --prefix ../apple/packages/geastack-apple
          npm run build --prefix ../apple/packages/geastack-apple
      - name: Install LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm-22.1.8'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-win64.exe'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c') {
            throw 'LLVM installer checksum mismatch'
          }
          $result = Start-Process $installer -ArgumentList @('/S', "/D=$llvm") -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "LLVM installer failed ($($result.ExitCode))" }
          if (!(Test-Path "$llvm\bin\clang++.exe")) { throw 'LLVM installation missing clang++' }
          "$llvm\bin" >> $env:GITHUB_PATH
          "LLVM_ROOT=$llvm" >> $env:GITHUB_ENV
      - name: Prepare Windows bindings
        if: runner.os == 'Windows'
        run: |
          npm ci --ignore-scripts --prefix ../windows/packages/geastack-windows
          npm run build --prefix ../windows/packages/geastack-windows
      - name: Compile pinned Gea compiler
        run: |
          npm ci --ignore-scripts --prefix ../compiler
          npm run architecture --prefix ../compiler
          node ../compiler/node_modules/typescript/bin/tsc -p ../compiler/tsconfig.json
          node ../compiler/scripts/mark-bins-executable.mjs
      - name: Build and test the native renderer
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          GEA_MACOS_JOBS: '3'
          GEA_BUILD_JOBS: '3'
          GEA_WINDOWS_JOBS: '3'
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix ../cli
          npm ci --ignore-scripts --prefix ../core/packages/core
          npm run check
          npm run format:check
          mkdir -p dist
          npm run render -- fixtures/card/card.html --width 480 --height 220 --out dist/card.png
          node scripts/native-asset.mjs
          npm run smoke:package
          npm run smoke:video
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ matrix.platform }}
          path: |
            html-renderer/dist/native-release/${{ matrix.platform }}.json
            html-renderer/dist/native-release/gea-html-renderer-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish-image:
    if: github.event_name == 'push' || inputs.image_only == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and test the Linux renderer image
        run: |
          version=$(node -p 'require("./package.json").version')
          image="gea-html-renderer:$version"
          echo "RENDERER_IMAGE=$image" >> "$GITHUB_ENV"
          echo "RENDERER_VERSION=$version" >> "$GITHUB_ENV"
          npm ci --ignore-scripts
          GEA_BUILD_JOBS=3 bash deploy/cloudflare/scripts/build-in-docker.sh
          docker build --platform linux/amd64 --file deploy/cloudflare/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image" .
          container=$(docker run --rm --detach --publish 127.0.0.1::8080 "$image")
          trap 'docker stop "$container" >/dev/null' EXIT
          address=$(docker port "$container" 8080/tcp)
          curl --fail --silent --show-error --retry 10 --retry-all-errors "http://$address/health"
          printf '<html><body style="background:#123456">Gea</body></html>' |
            curl --fail --silent --show-error --form 'files=@-;filename=index.html' \
              "http://$address/render" --output dist/cloudflare/release-smoke.png
          node -e '
            const png = require("node:fs").readFileSync("dist/cloudflare/release-smoke.png")
            if (png.subarray(0, 8).toString("hex") !== "89504e470d0a1a0a" ||
              png.readUInt32BE(16) !== 1920 || png.readUInt32BE(20) !== 1080) {
              throw new Error("Expected a 1920 × 1080 PNG")
            }
          '
          node scripts/smoke-svg.mjs "http://$address"
      - name: Package the versioned image
        run: |
          asset=dist/cloudflare/gea-html-renderer-container-linux-x64.tar.gz
          docker save "$RENDERER_IMAGE" | gzip > "$asset"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: cloudflare-container
          path: dist/cloudflare/gea-html-renderer-container-linux-x64.tar.gz
          if-no-files-found: error
      - name: Attach the image to the published renderer release
        if: inputs.image_only == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "renderer-v$RENDERER_VERSION" dist/cloudflare/gea-html-renderer-container-linux-x64.tar.gz

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [build, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: renderer-*
          path: dist/native-release
          merge-multiple: true
      - name: Publish native release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-native.mjs
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-container
          path: dist/cloudflare
      - name: Attach the image to the renderer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="renderer-v$version"
          if ! gh release view "$tag" --json assets --jq '.assets[].name' |
            grep -Fxq gea-html-renderer-container-linux-x64.tar.gz; then
            gh release upload "$tag" dist/cloudflare/gea-html-renderer-container-linux-x64.tar.gz
          fi
      - run: npm install -g npm@latest
      - run: node .github/scripts/publish.mjs
        env:
          RELEASE_PACKAGES: '[{"dir":"."}]'
