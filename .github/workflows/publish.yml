name: Publish

on:
  workflow_dispatch:
  push:
    branches: [release]

permissions:
  contents: read

concurrency: publish

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            target: apple
            ref: 6a50cda0854451e39a84f2996e1a1c005db60fdf
          - runner: ubuntu-24.04
            platform: linux-x64
            target: linux
            ref: df3d4e7681a0ba49b445dc2d3601491911f349a8
          - runner: windows-2025
            platform: win32-x64
            target: windows
            ref: 759df2e78b429c87559de38305280de6f8a438bf
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: html-renderer
    steps:
      - uses: actions/checkout@v4
        with:
          path: html-renderer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/cli
          ref: 16e5433b1a4590c03bdc599c9b85fc6fac5fac6a
          path: cli
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/core
          ref: 427f04fd7ca4b19551e88f8ebf49e059d0caa40d
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/${{ matrix.target }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.target }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/compiler
          ref: f97e0d3a36fd2d7df262df9e1e371f21893bf67d
          path: compiler
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev libfreetype-dev libpng-dev
      - name: Prepare Apple bindings
        if: runner.os == 'macOS'
        run: |
          npm ci --ignore-scripts --prefix ../apple
          npm ci --ignore-scripts --prefix ../apple/packages/geastack-apple
          npm run build --prefix ../apple/packages/geastack-apple
      - name: Prepare Windows bindings
        if: runner.os == 'Windows'
        run: |
          npm ci --ignore-scripts --prefix ../windows/packages/geastack-windows
          npm run build --prefix ../windows/packages/geastack-windows
      - name: Build and test the native renderer
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          GEA_MACOS_JOBS: '3'
          GEA_BUILD_JOBS: '3'
          GEA_WINDOWS_JOBS: '3'
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix ../cli
          npm ci --ignore-scripts --prefix ../core/packages/core
          npm ci --ignore-scripts --prefix ../compiler
          npm run build --prefix ../compiler
          npm run check
          npm run format:check
          mkdir -p dist
          npm run render -- fixtures/card.html --width 480 --height 220 --out dist/card.png
          node scripts/native-asset.mjs
          npm run smoke:package
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ matrix.platform }}
          path: |
            html-renderer/dist/native-release/${{ matrix.platform }}.json
            html-renderer/dist/native-release/gea-html-renderer-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: renderer-*
          path: dist/native-release
          merge-multiple: true
      - name: Publish native release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-native.mjs
      - run: npm install -g npm@latest
      - run: node .github/scripts/publish.mjs
        env:
          RELEASE_PACKAGES: '[{"dir":"."}]'
