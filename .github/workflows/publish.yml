name: Publish

on:
  workflow_dispatch:
  push:
    branches: [release]

permissions:
  contents: read

concurrency: publish

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            target: apple
            ref: f344daf6700c191b2f7d85a4b9c8578928ef2229
          - runner: ubuntu-24.04
            platform: linux-x64
            target: linux
            ref: a02b775c110e8c79ab88f9d3b36e41fea3cb30d5
          - runner: windows-2025
            platform: win32-x64
            target: windows
            ref: 6ea818ad17d6c8f6b9628b589e672be3ea843705
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: html-renderer
    steps:
      - uses: actions/checkout@v4
        with:
          path: html-renderer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/cli
          ref: 341ef9a24ae684f6a1d2c9b3abd3b9482c826de0
          path: cli
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/core
          ref: 382a20483fb792c9d9678ec74b63ed2fc4d0674b
          path: core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/${{ matrix.target }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.target }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geastack/compiler
          ref: f97e0d3a36fd2d7df262df9e1e371f21893bf67d
          path: compiler
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          packages=(libsdl2-dev libcurl4-openssl-dev libfreetype-dev libpng-dev)
          if ! command -v ffmpeg || ! command -v ffprobe; then packages+=(ffmpeg); fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Prepare FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then brew install ffmpeg; fi
      - name: Prepare FFmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then choco install ffmpeg -y --no-progress; fi
          echo 'C:/ProgramData/chocolatey/bin' >> "$GITHUB_PATH"
      - name: Prepare Apple bindings
        if: runner.os == 'macOS'
        run: |
          npm ci --ignore-scripts --prefix ../apple
          npm ci --ignore-scripts --prefix ../apple/packages/geastack-apple
          npm run build --prefix ../apple/packages/geastack-apple
      - name: Install LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm-22.1.8'
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-win64.exe'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c') {
            throw 'LLVM installer checksum mismatch'
          }
          $result = Start-Process $installer -ArgumentList @('/S', "/D=$llvm") -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "LLVM installer failed ($($result.ExitCode))" }
          if (!(Test-Path "$llvm\bin\clang++.exe")) { throw 'LLVM installation missing clang++' }
          "$llvm\bin" >> $env:GITHUB_PATH
          "LLVM_ROOT=$llvm" >> $env:GITHUB_ENV
      - name: Prepare Windows bindings
        if: runner.os == 'Windows'
        run: |
          npm ci --ignore-scripts --prefix ../windows/packages/geastack-windows
          npm run build --prefix ../windows/packages/geastack-windows
      - name: Compile pinned Gea compiler
        run: |
          npm ci --ignore-scripts --prefix ../compiler
          npm run architecture --prefix ../compiler
          node ../compiler/node_modules/typescript/bin/tsc -p ../compiler/tsconfig.json
          node ../compiler/scripts/mark-bins-executable.mjs
      - name: Build and test the native renderer
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          GEA_MACOS_JOBS: '3'
          GEA_BUILD_JOBS: '3'
          GEA_WINDOWS_JOBS: '3'
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix ../cli
          npm ci --ignore-scripts --prefix ../core/packages/core
          npm run check
          npm run format:check
          mkdir -p dist
          npm run render -- fixtures/card/card.html --width 480 --height 220 --out dist/card.png
          node scripts/native-asset.mjs
          npm run smoke:package
          npm run smoke:video
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ matrix.platform }}
          path: |
            html-renderer/dist/native-release/${{ matrix.platform }}.json
            html-renderer/dist/native-release/gea-html-renderer-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: renderer-*
          path: dist/native-release
          merge-multiple: true
      - name: Publish native release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-native.mjs
      - run: npm install -g npm@latest
      - run: node .github/scripts/publish.mjs
        env:
          RELEASE_PACKAGES: '[{"dir":"."}]'
