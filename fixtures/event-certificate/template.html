<!doctype html>
<html>
<head>
  <title>Event certificate</title>
  <link rel="stylesheet" href="event-certificate.css">
</head>
<body style="background-color: #FBF8F1;">
  <main class="page"
    ><div class="ring ring-3"></div
    ><div class="ring ring-2"></div
    ><div class="ring ring-1"></div
    ><div class="frame-outer"></div
    ><div class="frame-inner"></div
    ><div class="corner corner-tl"></div
    ><div class="corner corner-tr"></div
    ><div class="corner corner-bl"></div
    ><div class="corner corner-br"></div
    ><div class="content"
      ><div class="brand"
        ><div class="mark"><div class="mark-core"></div></div
        ><p class="wordmark">EMBEDDED FUTURES SUMMIT 2027</p
      ></div
      ><p class="title">{{title}}</p
      ><div class="rule"></div
      ><p class="lead">This certificate is proudly presented to</p
      ><p class="name">{{name}}</p
      ><p class="statement">{{statement}}</p
      ><div class="details">{{#details}}<div class="detail detail-{{index}}"><p class="label">{{label}}</p><p class="value">{{value}}</p></div>{{/details}}</div
      ><div class="spacer"></div
      ><div class="signatures"
        ><div class="signature"
          ><div class="sign-line"></div
          ><p class="signer">Dr. Lena Hartmann</p
          ><p class="signer-role">Programme Chair</p
        ></div
        ><div class="seal"
          ><div class="star star-1"></div
          ><div class="star star-2"></div
          ><div class="star star-3"></div
          ><div class="seal-disc"></div
          ><div class="seal-ring"></div
          ><div class="seal-text"><p class="seal-main">EFS</p><p class="seal-year">2027</p></div
        ></div
        ><div class="signature"
          ><div class="sign-line"></div
          ><p class="signer">Tobias Krell</p
          ><p class="signer-role">Summit Director</p
        ></div
      ></div
    ></div
  ></main>
</body>
</html>
