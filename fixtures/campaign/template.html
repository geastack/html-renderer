<!doctype html>
<html>
<head>
  <title>GeaStack campaign</title>
  <link rel="stylesheet" href="campaign.css">
</head>
<body>
  <main class="card {{layout}}"
    ><div class="bar"></div
    ><div class="top"
      ><img class="logo" src="../shared/images/gea-logo.png" alt="Gea"
      ><div class="grow"></div
      ><p class="eyebrow">GEASTACK</p
    ></div
    ><div class="grow lead"></div
    ><p class="headline">{{headline}}</p
    ><div class="subline"
      ><p class="sub">{{sub1}}</p
      ><p class="sub">{{sub2}}</p
    ></div
    ><div class="stack"
      ><div class="step s1"><p class="step-label">ESP32</p></div
      ><div class="step s2"><p class="step-label">iOS</p></div
      ><div class="step s3"><p class="step-label">Android</p></div
      ><div class="step s4"><p class="step-label">macOS</p></div
      ><div class="step s5"><p class="step-label">Windows</p></div
      ><div class="step s6"><p class="step-label">Xbox</p></div
    ></div
    ><div class="grow"></div
    ><div class="cta"
      ><p class="button">{{cta}}</p
      ><p class="url">geastack.com</p
    ></div
  ></main>
</body>
</html>
